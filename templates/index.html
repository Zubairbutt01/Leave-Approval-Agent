<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Leave Approval Agent</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;
        }


        .container {

            width: 95%;

            max-width: 800px;

            background: white;

            border-radius: 12px;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);

            overflow: hidden;
        }


        .header {

            background: #1f2937;

            color: white;

            padding: 20px;

            text-align: center;
        }


        .header h1 {

            margin: 0;

            font-size: 24px;
        }


        .header p {

            margin: 8px 0 0;

            color: #d1d5db;
        }


        #chat {

            height: 500px;

            overflow-y: auto;

            padding: 20px;

            background: #f9fafb;
        }


        .message {

            margin-bottom: 15px;

            padding: 12px 15px;

            border-radius: 10px;

            max-width: 80%;

            line-height: 1.5;

            white-space: pre-wrap;
        }


        .user {

            background: #2563eb;

            color: white;

            margin-left: auto;
        }


        .agent {

            background: #e5e7eb;

            color: #111827;

            margin-right: auto;
        }


        .input-area {

            display: flex;

            gap: 10px;

            padding: 15px;

            border-top: 1px solid #ddd;

            background: white;
        }


        #message {

            flex: 1;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }


        button {

            padding: 12px 20px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;
        }


        button:hover {

            background: #1d4ed8;
        }


        button:disabled {

            background: #9ca3af;

            cursor: not-allowed;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="header">

        <h1>Leave Approval Agent</h1>

        <p>Employee Leave Request Assistant</p>

    </div>


    <div id="chat">

        <div class="message agent">

            Hello! I am the Leave Approval Agent.

            Please enter your Employee ID to begin.

        </div>

    </div>


    <div class="input-area">

        <input
            type="text"
            id="message"
            placeholder="Type your message..."
            autocomplete="off"
        >

        <button id="sendButton">

            Send

        </button>

    </div>


</div>


<script>


    // =====================================================
    // CREATE A UNIQUE CHAT SESSION
    // =====================================================

    let threadId = localStorage.getItem(
        "leave_thread_id"
    );


    if (!threadId) {

        threadId = crypto.randomUUID();

        localStorage.setItem(
            "leave_thread_id",
            threadId
        );
    }


    // =====================================================
    // HTML ELEMENTS
    // =====================================================

    const messageInput =
        document.getElementById("message");


    const sendButton =
        document.getElementById("sendButton");


    const chat =
        document.getElementById("chat");


    // =====================================================
    // ADD MESSAGE TO SCREEN
    // =====================================================

    function addMessage(
        text,
        type
    ) {

        const message =
            document.createElement("div");


        message.className =
            "message " + type;


        message.textContent =
            text;


        chat.appendChild(message);


        chat.scrollTop =
            chat.scrollHeight;
    }


    // =====================================================
    // SEND MESSAGE
    // =====================================================

    async function sendMessage() {


        const message =
            messageInput.value.trim();


        if (!message) {

            return;
        }


        addMessage(
            message,
            "user"
        );


        messageInput.value = "";


        sendButton.disabled = true;


        sendButton.textContent =
            "Sending...";


        try {


            const response =
                await fetch(
                    "/chat",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            message: message,

                            thread_id: threadId

                        })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Something went wrong."
                );
            }


            addMessage(
                data.response,
                "agent"
            );


        }

        catch (error) {


            addMessage(
                "Error: " + error.message,
                "agent"
            );

        }


        finally {

            sendButton.disabled =
                false;

            sendButton.textContent =
                "Send";

            messageInput.focus();
        }

    }


    // =====================================================
    // BUTTON
    // =====================================================

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    // =====================================================
    // ENTER KEY
    // =====================================================

    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                sendMessage();

            }

        }
    );


</script>


</body>

</html>
