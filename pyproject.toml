[project]
name = "leave-approval-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-core>=1.6.5",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
    "supabase>=2.31.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
leave-approval-agent = "leave_approval_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
